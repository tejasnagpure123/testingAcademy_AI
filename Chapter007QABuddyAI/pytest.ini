[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail fast on first error during unit tests — useful for local dev
# Remove -x for CI to collect all failures
addopts = -v --tb=short

# Markers for selective test runs
markers =
    unit: Fast unit tests with no external dependencies
    integration: Tests requiring a running Qdrant instance
    slow: Tests that take more than a few seconds (e.g., model loading)

# Minimum pytest version
minversion = 8.0

# Warnings filter
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:loguru
