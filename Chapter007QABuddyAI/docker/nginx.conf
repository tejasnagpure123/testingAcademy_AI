# ============================================================
# QABuddy.ai — Nginx Reverse Proxy Configuration
# Routes traffic to API and UI services
# ============================================================

events {
    worker_connections 1024;
}

http {
    # ─── Upstream Servers ────────────────────────────────
    upstream api_server {
        server qabuddy-api:8000;
    }

    upstream ui_server {
        server qabuddy-ui:8501;
    }

    # ─── Main Server Block ──────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ─── API Routes ────────────────────────────────
        location /api/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for long-running operations (ingestion)
            proxy_read_timeout 600s;
            proxy_connect_timeout 30s;
        }

        # API docs
        location /docs {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
        }

        # ─── UI Routes (default) ───────────────────────
        location / {
            proxy_pass http://ui_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Streamlit
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Streamlit static files
        location /_stcore/ {
            proxy_pass http://ui_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /static/ {
            proxy_pass http://ui_server;
        }
    }
}
