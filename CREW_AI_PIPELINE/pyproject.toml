[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-qa-crew"
version = "0.1.0"
description = "CrewAI pipeline for generating traceable QA artifacts from Jira issues"
requires-python = ">=3.11"
dependencies = [
  "crewai==1.15.22",
  "streamlit==1.50.0",
  "pydantic==2.12.5",
  "python-dotenv==1.2.2",
  "requests==2.32.5",
  "pandas==2.3.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-mock==3.15.1", "ruff==0.14.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]