name: Python CI

on:
  push:
    paths: ["CREW_AI_PIPELINE/**"]
  pull_request:
    paths: ["CREW_AI_PIPELINE/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CREW_AI_PIPELINE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CREW_AI_PIPELINE/requirements.txt
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q